<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMG — Recitation Recording</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}header{background:#123b2a;color:#fff;padding:18px;text-align:center}header h1{margin:0;font-size:22px}header p{margin:6px 0 0;opacity:.85}main{max-width:650px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px rgba(0,0,0,.08)}h2{margin-top:0;font-size:19px}label{display:block;font-weight:700;margin:12px 0 6px}input,button{width:100%;padding:13px;border-radius:9px;border:1px solid #ccd3d8;font-size:16px}button{border:0;font-weight:700;cursor:pointer;margin-top:10px}.primary{background:#176b45;color:#fff}.danger{background:#b42318;color:#fff}.secondary{background:#e9eef0;color:#17202a}.status{padding:14px;border-radius:10px;background:#eef2f3;font-weight:700;text-align:center}.status.recording{background:#fde8e7;color:#b42318}.status.ready{background:#e7f5ec;color:#176b45}.status.saved{background:#e8f0ff;color:#174ea6}.big{font-size:28px;text-align:center;margin:8px 0}.small{font-size:13px;color:#667085}.hidden{display:none!important}#error{white-space:pre-wrap;color:#b42318}</style></head><body><header><h1>Muslim Mercy Group</h1><p>MMG Recitation Recording</p></header><main><div class="card"><h2>Recording Device</h2><div id="status" class="status">NOT CONNECTED</div><label>Student ID</label><input id="studentId" placeholder="MMG/26/001" autocomplete="off"><label>Session ID</label><input id="sessionId" type="number" placeholder="Competition session ID"><label>Question ID</label><input id="questionId" type="number" placeholder="Question ID"><button class="primary" id="connectBtn">Connect Microphone</button></div><div class="card"><h2>Current Question</h2><div class="big" id="questionLabel">—</div><div class="smal
l" id="sessionLabel">No session connected</div></div><div class="card"><h2>Recording</h2><div class="big" id="timer">00:00</div><button class="primary hidden" id="startBtn">Start Question Recording</button><button class="danger hidden" id="stopBtn">Stop &amp; Save Recording</button><button class="secondary hidden" id="cancelBtn">Cancel Recording</button><div id="message" class="small" style="margin-top:12px"></div><div id="error"></div></div></main><script>
const SUPABASE_URL="https://nsalofqzqhivlaiqpfhe.supabase.co";const SUPABASE_KEY="sb_publishable_8AhIurbjKxLbn4rwoQE3ww_7ffssjoX";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const BUCKET="recitation-recordings";const $=id=>document.getElementById(id);let mediaStream=null,mediaRecorder=null,audioChunks=[],recordingStartedAt=null,timerInterval=null,realtimeChannel=null,mimeType="";
function setStatus(t,c=""){$("status").textContent=t;$('status').className="status "+c}function message(t){$("message").textContent=t||""}function showError(e){$("error").textContent=e?String(e.message||e):""}function formatTime(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function updateTimer(){$("timer").textContent=recordingStartedAt?formatTime((Date.now()-recordingStartedAt)/1000):"00:00"}function startTimer(){clearInterval(timerInterval);timerInterval=setInterval(updateTimer,1000);updateTimer()}function stopTimer(){clearInterval(timerInterval);timerInterval=null;updateTimer()}function chooseMimeType(){return ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].find(x=>MediaRecorder.isTypeSupported(x))||""}
async function connectMicrophone(){showError("");if(!navigator.mediaDevices?.getUserMedia){showError("This browser does not support microphone recording.");return}try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});mimeType=chooseMimeType();if(!window.MediaRecorder)throw new Error("MediaRecorder is not supported on this device.");setStatus("MICROPHONE READY","ready");message("Microphone connected. The dedicated phone is ready.");$("connectBtn").classList.add("hidden");$("startBtn").classList.remove("hidden")}catch(e){showError(e)}}
function ext(t){return t.includes("mp4")?"m4a":t.includes("ogg")?"ogg":"webm"}async function startRecording(){showError("");const student=$("studentId").value.trim().toUpperCase(),sid=Number($("sessionId").value),qid=Number($("questionId").value);if(!student)return showError("Enter the Student ID.");if(!Number.isInteger(sid)||sid<=0)return showError("Enter a valid Session ID.");if(!Number.isInteger(qid)||qid<=0)return showError("Enter a valid Question ID.");if(!mediaStream){await connectMicrophone();if(!mediaStream)return}audioChunks=[];recordingStartedAt=Date.now();mediaRecorder=mimeType?new MediaRecorder(mediaStream,{mimeType}):new MediaRecorder(mediaStream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data)};mediaRecorder.onerror=e=>showError("Recording error: "+(e.error?.message||"Unknown error"));mediaRecorder.start(1000);setStatus("RECORDING","recording");message("Recording the student's entire question.");$("startBtn").classList.add("hidden");$("stopBtn").classList.remove("hidden");$("cancelBtn").classList.remove("hidden");startTimer()}
function stopRecording(){return new Promise(r=>{if(!mediaRecorder||mediaRecorder.state==="inactive")return r();mediaRecorder.addEventListener("stop",r,{once:true});mediaRecorder.stop()})}async function saveRecording(){showError("");message("Saving recording...");const student=$("studentId").value.trim().toUpperCase(),sid=Number($("sessionId").value),qid=Number($("questionId").value),ended=new Date(),started=recordingStartedAt?new Date(recordingStartedAt):ended,duration=Math.max(0,Math.round((ended-started)/1000)),type=mediaRecorder?.mimeType||mimeType||"audio/webm",safe=student.replace(/[^A-Z0-9_-]/gi,"_"),stamp=started.toISOString().replace(/[:.]/g,"-"),path=`${safe}/session-${sid}/question-${qid}/${stamp}.${ext(type)}`,blob=new Blob(audioChunks,{type});let {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,upsert:false});if(error)throw error;({error}=await sb.from("recitation_recordings").insert({competition_year:2026,student_id:student,session_id:sid,question_id:qid,question_number:$("questionLabel").textContent==="—"?null:$("questionLabel").textContent,storage_bucket:BUCKET,storage_path:path,duration_seconds:duration,file_size_bytes:blob.size,mime_type:type,status:"completed",started_at:started.toISOString(),ended_at:ended.toISOString()}));if(error)throw new Error("Audio uploaded, but database record failed: "+error.message);setStatus("RECORDING SAVED","saved");message(`Saved successfully. Duration: ${formatTime(duration)}`);$("stopBtn").classList.add("hidden");$("cancelBtn").classList.add("hidden");$("startBtn").classList.remove("hidden");audioChunks=[];recordingStartedAt=null;stopTimer()}
async function stopAndSave(){$("stopBtn").disabled=true;try{await stopRecording();await saveRecording()}catch(e){showError(e);setStatus("SAVE ERROR");message("The recording was not fully saved.")}finally{$("stopBtn").disabled=false}}function cancelRecording(){if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();audioChunks=[];recordingStartedAt=null;stopTimer();setStatus("MICROPHONE READY","ready");message("Recording cancelled.");$("stopBtn").classList.add("hidden");$("cancelBtn").classList.add("hidden");$("startBtn").classList.remove("hidden")}
async function loadSession(){showError("");const sid=Number($("sessionId").value);if(!Number.isInteger(sid)||sid<=0)return showError("Enter a valid Session ID.");const {data,error}=await sb.from("competition_sessions").select("id,student_id,ques_id,is_active,started_at,ended_at,current_subquestion").eq("id",sid).maybeSingle();if(error)return showError(error);if(!data)return showError("Competition session not found.");$("studentId").value=String(data.student_id||"").toUpperCase();$("questionId").value=data.ques_id||"";$("questionLabel").textContent=data.ques_id?`Question ${data.ques_id}`:"—";$("sessionLabel").textContent=`Session ${data.id} • Student ${data.student_id||"—"}`;message(data.is_active?"Active competition session found.":"Session found but it is not active.");subscribe(data.id)}
function subscribe(sid){if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel("mmg-recording-session-"+sid).on("postgres_changes",{event:"UPDATE",schema:"public",table:"competition_sessions",filter:"id=eq."+sid},p=>{if(p.new.is_active)message(`Session ${p.new.id} is active.`);else{if(mediaRecorder&&mediaRecorder.state!=="inactive")stopAndSave();message("Competition session ended.")}}).subscribe()}
$("connectBtn").onclick=connectMicrophone;$("startBtn").onclick=startRecording;$("stopBtn").onclick=stopAndSave;$("cancelBtn").onclick=cancelRecording;$("sessionId").onchange=loadSession;window.onbeforeunload=()=>{if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());if(realtimeChannel)sb.removeChannel(realtimeChannel)};
</script></body></html>
